name: Flight-to-hotel integration test

on:
  workflow_dispatch:
    inputs:
      airport:
        description: Departure airport
        required: true
        type: choice
        options:
          - MAN
          - BHX
          - LBA
        default: MAN
      region:
        description: Flight discovery region
        required: true
        type: choice
        options:
          - worldwide
          - europe
          - asia
          - africa
          - north_america
          - south_america
          - oceania
        default: worldwide

permissions:
  contents: write

concurrency:
  group: serpapi-monthly-ledger
  cancel-in-progress: false

jobs:
  flight-to-hotel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test flight-to-hotel matching and credit ledger
        run: python -m unittest discover -s tests -v
      - name: Reserve one flight search and persist ledger before API call
        run: |
          python credit_ledger.py reserve --category flight --count 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usage/monthly.json
          git commit -m "Record SerpApi flight search reservation"
          git push
      - name: Discover flights and dates
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -z "$SERPAPI_KEY" ]; then
            echo "SERPAPI_KEY repository secret is missing."
            exit 1
          fi
          python explore_scan.py --airport "${{ inputs.airport }}" --region "${{ inputs.region }}"
      - name: Check whether any hotel candidate qualifies
        id: candidates
        run: |
          CSV_PATH="$(find data/runs -name destinations.csv -type f -print -quit)"
          if [ -z "$CSV_PATH" ]; then
            echo "No destination CSV found; no hotel request will be made."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT="$(python -c 'import sys; from hotel_scan import load_flight_candidates; print(len(load_flight_candidates(sys.argv[1], 250)))' "$CSV_PATH")"
          echo "Eligible priced destinations with valid dates: $COUNT"
          echo "csv_path=$CSV_PATH" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reserve one hotel search and persist ledger before API call
        if: steps.candidates.outputs.eligible == 'true'
        run: |
          python credit_ledger.py reserve --category hotel --count 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usage/monthly.json
          git commit -m "Record SerpApi hotel search reservation"
          git push
      - name: Search hotels using flight dates
        if: steps.candidates.outputs.eligible == 'true'
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          python hotel_scan.py --from-csv "${{ steps.candidates.outputs.csv_path }}" --max-searches 1 --max-flight-price 250
      - name: Store historical flight and hotel price observations
        if: always()
        run: |
          JSON_PATH="$(find data/runs -name "${{ inputs.airport }}_${{ inputs.region }}.json" -type f -print | sort | tail -n 1)"
          if [ -n "$JSON_PATH" ]; then
            python deal_tracker.py ingest-explore --file "$JSON_PATH"
          fi
          HOTEL_CSV="$(find data/hotels -name hotels.csv -type f -print | sort | tail -n 1)"
          if [ -n "$HOTEL_CSV" ]; then
            python deal_tracker.py ingest-hotels --file "$HOTEL_CSV"
          fi
          if [ -f data/history/observations.jsonl ]; then
            git add data/history/observations.jsonl
            git commit -m "Store historical holiday prices" || echo "No new history changes"
            git push
          fi
      - name: Explain skipped hotel search
        if: steps.candidates.outputs.eligible != 'true'
        run: echo "No eligible flight candidate; no hotel credit reserved or hotel API request made."
      - name: Upload combined flight and hotel results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-hotel-test-${{ inputs.airport }}-${{ inputs.region }}-${{ github.run_number }}
          path: data/
          if-no-files-found: warn
          retention-days: 14
