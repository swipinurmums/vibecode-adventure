name: Flight-to-hotel integration test

on:
  workflow_dispatch:
    inputs:
      airport:
        description: Departure airport
        required: true
        type: choice
        options:
          - MAN
          - BHX
          - LBA
        default: MAN
      region:
        description: Flight discovery region
        required: true
        type: choice
        options:
          - worldwide
          - europe
          - asia
          - africa
          - north_america
          - south_america
          - oceania
        default: worldwide

permissions:
  contents: read

jobs:
  flight-to-hotel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test flight-to-hotel matching logic
        run: python -m unittest discover -s tests -v
      - name: Discover flights and dates
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -z "$SERPAPI_KEY" ]; then
            echo "SERPAPI_KEY repository secret is missing."
            exit 1
          fi
          python explore_scan.py --airport "${{ inputs.airport }}" --region "${{ inputs.region }}"
      - name: Search hotels for the cheapest eligible flight
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          CSV_PATH="$(find data/runs -name destinations.csv -type f -print -quit)"
          if [ -z "$CSV_PATH" ]; then
            echo "Flight scan produced no destination CSV; no hotel search made."
            exit 1
          fi
          echo "Using flight results from: $CSV_PATH"
          python hotel_scan.py --from-csv "$CSV_PATH" --max-searches 1 --max-flight-price 250
      - name: Upload combined flight and hotel results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-hotel-test-${{ inputs.airport }}-${{ inputs.region }}-${{ github.run_number }}
          path: data/
          if-no-files-found: warn
          retention-days: 14
