name: Deploy Hunter dashboard

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "data/deals/deals.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("docs/index.html").read_text(encoding="utf-8")
          if "<script>" not in html or "</script>" not in html:
              raise SystemExit("Dashboard script block is missing")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/hunter-dashboard.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/hunter-dashboard.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
