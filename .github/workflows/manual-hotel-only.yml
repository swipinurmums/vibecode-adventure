name: Manual hotel-only search

on:
  workflow_dispatch:
    inputs:
      continent:
        description: Continent to search
        required: true
        type: choice
        options:
          - Africa
          - Asia
          - Europe
          - North America
          - South America
          - Oceania
      country:
        description: Optional country to narrow the search
        required: false
        type: string
      destination:
        description: Optional city or destination to narrow the search
        required: false
        type: string
      check_in_month:
        description: Flexible check-in month (YYYY-MM)
        required: true
        type: string
      check_out_month:
        description: Flexible check-out month (YYYY-MM)
        required: true
        type: string
      min_nights:
        description: Minimum stay length
        required: true
        type: choice
        options:
          - "3"
          - "5"
          - "7"
        default: "3"
      max_nights:
        description: Maximum stay length
        required: true
        type: choice
        options:
          - "5"
          - "7"
          - "10"
          - "14"
        default: "7"
      max_searches:
        description: Number of date combinations to compare (each uses one hotel search)
        required: true
        type: choice
        options:
          - "3"
          - "5"
          - "7"
        default: "5"
      adults:
        description: Number of adults
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
        default: "1"

permissions:
  contents: write

concurrency:
  group: serpapi-monthly-ledger
  cancel-in-progress: false

jobs:
  hotel-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run API-free backend tests before reserving credits
        run: python -m unittest discover -s tests -v
      - name: Validate flexible month and stay-length inputs
        env:
          CHECK_IN_MONTH: ${{ inputs.check_in_month }}
          CHECK_OUT_MONTH: ${{ inputs.check_out_month }}
          MIN_NIGHTS: ${{ inputs.min_nights }}
          MAX_NIGHTS: ${{ inputs.max_nights }}
          MAX_SEARCHES: ${{ inputs.max_searches }}
        run: |
          python - <<'PY'
          import os
          from hotel_scan import generate_flexible_stays
          stays = generate_flexible_stays(
              os.environ["CHECK_IN_MONTH"], os.environ["CHECK_OUT_MONTH"],
              int(os.environ["MIN_NIGHTS"]), int(os.environ["MAX_NIGHTS"]),
              int(os.environ["MAX_SEARCHES"]))
          print(f"Validated {len(stays)} date combinations: {stays}")
          PY
      - name: Reserve hotel search before API request
        run: |
          python credit_ledger.py reserve --category hotel --count ${{ inputs.max_searches }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usage/monthly.json
          git commit -m "Reserve manual hotel-only search"
          git push
      - name: Search hotels without requiring a flight
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          CONTINENT: ${{ inputs.continent }}
          DESTINATION: ${{ inputs.destination }}
          COUNTRY: ${{ inputs.country }}
          CHECK_IN_MONTH: ${{ inputs.check_in_month }}
          CHECK_OUT_MONTH: ${{ inputs.check_out_month }}
          MIN_NIGHTS: ${{ inputs.min_nights }}
          MAX_NIGHTS: ${{ inputs.max_nights }}
          MAX_SEARCHES: ${{ inputs.max_searches }}
          ADULTS: ${{ inputs.adults }}
        run: |
          python hotel_scan.py --continent "$CONTINENT" --destination "$DESTINATION" --country "$COUNTRY" --check-in-month "$CHECK_IN_MONTH" --check-out-month "$CHECK_OUT_MONTH" --min-nights "$MIN_NIGHTS" --max-nights "$MAX_NIGHTS" --max-searches "$MAX_SEARCHES" --adults "$ADULTS"
      - name: Store hotel observations and refresh deal feed
        run: |
          HOTEL_CSV="$(find data/hotels -name hotels.csv -type f -print | sort | tail -n 1)"
          if [ -z "$HOTEL_CSV" ]; then echo "Hotel results file not found"; exit 1; fi
          python deal_tracker.py ingest-hotels --file "$HOTEL_CSV"
          python deal_tracker.py rebuild-history
          python deal_feed.py
          git add data/history/observations.jsonl data/deals/deals.json
          git commit -m "Store standalone hotel deals and refresh feed" || echo "No new hotel data to commit"
          git push
      - name: Upload hotel-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-only-results-${{ github.run_number }}
          path: data/hotels/
          if-no-files-found: warn
          retention-days: 14
